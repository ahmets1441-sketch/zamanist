locale: tr

backend:
  name: github
  repo: ahmets1441-sketch/zamanist
  branch: main
  base_url: https://zamanist.com
  auth_endpoint: api/auth

media_folder: src/img/yuklenen
public_folder: /img/yuklenen

collections:
  - name: kombinlerim
    label: Kombinlerim
    label_singular: Kombin
    folder: src/kombinlerim
    create: true
    slug: "{{slug}}"
    sortable_fields: [date, title]
    fields:
      - { label: Başlık, name: title, widget: string }
      - { label: Tarih, name: date, widget: datetime, format: "YYYY-MM-DD", date_format: "DD.MM.YYYY", time_format: false }
      - { label: Kapak fotoğrafı, name: kapak, widget: image, required: false }
      - { label: Kısa özet, name: ozet, widget: text, required: false, hint: "Listede ve Google'da başlığın altında görünür. 1-2 cümle." }
      - { label: Yazar, name: author, widget: string, default: Zamanist }
      - { label: Metin, name: body, widget: markdown }
  - name: sporcularin-stili
    label: Sporcuların Stili
    label_singular: Sporcu yazısı
    folder: src/sporcularin-stili
    create: true
    slug: "{{slug}}"
    sortable_fields: [date, title]
    fields:
      - { label: Başlık, name: title, widget: string }
      - { label: Tarih, name: date, widget: datetime, format: "YYYY-MM-DD", date_format: "DD.MM.YYYY", time_format: false }
      - { label: Kapak fotoğrafı, name: kapak, widget: image, required: false }
      - { label: Kısa özet, name: ozet, widget: text, required: false, hint: "Listede ve Google'da başlığın altında görünür. 1-2 cümle." }
      - { label: Yazar, name: author, widget: string, default: Zamanist }
      - { label: Metin, name: body, widget: markdown }
  - name: rehberler
    label: Rehberler
    label_singular: Rehber
    folder: src/rehberler
    create: true
    slug: "{{slug}}"
    sortable_fields: [date, title]
    fields:
      - { label: Başlık, name: title, widget: string }
      - { label: Tarih, name: date, widget: datetime, format: "YYYY-MM-DD", date_format: "DD.MM.YYYY", time_format: false }
      - { label: Kapak fotoğrafı, name: kapak, widget: image, required: false }
      - { label: Kısa özet, name: ozet, widget: text, required: false, hint: "Listede ve Google'da başlığın altında görünür. 1-2 cümle." }
      - { label: Yazar, name: author, widget: string, default: Zamanist }
      - { label: Metin, name: body, widget: markdown }
  - name: biyografiler
    label: Biyografiler
    label_singular: Biyografi
    folder: src/biyografiler
    create: true
    slug: "{{slug}}"
    fields:
      - { label: İsim, name: title, widget: string }
      - { label: Kapak fotoğrafı, name: kapak, widget: image, required: false }
      - { label: Kısa özet, name: ozet, widget: text, required: false, hint: "Listede ve Google'da başlığın altında görünür. 1-2 cümle." }
      - { label: Metin, name: body, widget: markdown }
  - name: araba-ve-saat
    label: Araba ve Saat
    label_singular: Araba ve saat yazısı
    folder: src/araba-ve-saat
    create: true
    slug: "{{slug}}"
    sortable_fields: [date, title]
    fields:
      - { label: Başlık, name: title, widget: string }
      - { label: Tarih, name: date, widget: datetime, format: "YYYY-MM-DD", date_format: "DD.MM.YYYY", time_format: false }
      - { label: Kapak fotoğrafı, name: kapak, widget: image, required: false }
      - { label: Kısa özet, name: ozet, widget: text, required: false, hint: "Listede ve Google'da başlığın altında görünür. 1-2 cümle." }
      - { label: Yazar, name: author, widget: string, default: Zamanist }
      - { label: Metin, name: body, widget: markdown }
  - name: saatler
    label: Saat Fiyatları
    label_singular: Saat
    folder: src/saatler
    create: true
    slug: "{{slug}}"
    sortable_fields: [title, marka]
    fields:
      - { label: Saat adı, name: title, widget: string, hint: "Örn. Hamilton Khaki Field Murph 38mm" }
      - { label: Marka, name: marka, widget: string }
      - { label: Referans numarası, name: referans, widget: string, hint: "Kutuda ve etikette yazan model kodu, örn. H70405140" }
      - { label: Ülke, name: ulke, widget: select, options: [{ label: Japonya, value: japonya }], default: japonya }
      - { label: Kapak fotoğrafı, name: kapak, widget: image, required: false, hint: "Kendi fotoğrafınızı yükleyin veya bir satıcı ilanındaki fotoğrafın adresini yapıştırın." }
      - { label: Fotoğrafın kaynağı, name: kapak_kaynak, widget: string, required: false, hint: "Başkasının fotoğrafıysa sahibini yazın, örn. Hamilton resmi Rakuten mağazası" }
      - { label: Fotoğraf kaynağının linki, name: kapak_link, widget: string, required: false }
      - { label: Türkiye fiyatı (TL), name: tr_fiyat, widget: number, value_type: int, required: false }
      - { label: Türkiye fiyatı kaynağı, name: tr_kaynak, widget: string, required: false, hint: "Örn. Hamilton Türkiye (resmi site)" }
      - { label: Türkiye fiyatı linki, name: tr_kaynak_link, widget: string, required: false }
      - { label: Türkiye fiyatı notu, name: tr_not, widget: string, required: false }
      - { label: Fiyatların kontrol tarihi, name: kontrol_tarihi, widget: datetime, format: "YYYY-MM-DD", date_format: "DD.MM.YYYY", time_format: false }
      - label: Satış yerleri
        name: magazalar
        widget: list
        required: false
        summary: "{{fields.ad}} · {{fields.fiyat}}"
        fields:
          - { label: Mağaza adı, name: ad, widget: string }
          - { label: Şehir, name: sehir, widget: string, required: false }
          - { label: Tür, name: tip, widget: select, options: [{ label: "Mağaza (vergi iadesi var)", value: magaza }, { label: "Online (vergi iadesi yok)", value: online }], default: magaza }
          - { label: Fiyat (yerel para, vergiler dahil), name: fiyat, widget: number, value_type: int }
          - { label: Adres, name: adres, widget: string, required: false, hint: "Japonca adres yazılırsa taksiciye gösterilebilir ve haritada doğru açılır." }
          - { label: Telefon, name: tel, widget: string, required: false }
          - { label: Çalışma saatleri, name: saatler, widget: string, required: false }
          - { label: Google puanı, name: puan, widget: string, required: false, hint: "Google Haritalar'daki yıldız, örn. 4,3" }
          - { label: Kaynak linki, name: link, widget: string, required: false }
      - { label: Açıklama, name: body, widget: markdown }
  - name: veriler
    label: Veriler
    files:
      - name: indirimler
        label: İndirim takvimi
        file: src/_data/indirimler.json
        format: json
        fields:
          - label: İndirimler
            name: indirimler
            widget: list
            summary: "{{fields.baslangic}} · {{fields.baslik}} ({{fields.durum}})"
            hint: "Türkiye'deki indirim dönemleri. Tarihi kesinleşmemişse durumu Tahmini yapın ve notta neye göre tahmin ettiğinizi yazın."
            fields:
              - { label: Başlık, name: baslik, widget: string, hint: "örn. Inditex kış sezon sonu indirimi" }
              - { label: Grup, name: grup, widget: string, hint: "Takip bu ada göre yapılır: Inditex, Nike, Pazar yerleri…" }
              - { label: Markalar, name: markalar, widget: list, field: { label: Marka, name: marka, widget: string } }
              - { label: Kategori, name: kategori, widget: select, options: [{ label: Giyim, value: giyim }, { label: Ayakkabı, value: ayakkabi }, { label: Saat ve aksesuar, value: saat }, { label: Pazar yerleri, value: pazaryeri }, { label: Genel, value: genel }] }
              - { label: Başlangıç, name: baslangic, widget: datetime, format: "YYYY-MM-DD", date_format: "DD.MM.YYYY", time_format: false }
              - { label: Bitiş, name: bitis, widget: datetime, format: "YYYY-MM-DD", date_format: "DD.MM.YYYY", time_format: false, required: false }
              - { label: Durum, name: durum, widget: select, options: [{ label: Duyuruldu, value: duyuruldu }, { label: Tahmini, value: tahmini }], default: tahmini }
              - { label: Oran, name: oran, widget: string, required: false, hint: "örn. %50'ye varan" }
              - { label: Kanal, name: kanal, widget: string, required: false, hint: "online, mağaza, önce online…" }
              - { label: Kaynak linki, name: kaynak, widget: string, required: false, hint: "Duyuruldu ise markanın veya haberin linki" }
              - { label: Not, name: not, widget: text, required: false }
      - name: resmi-fiyatlar
        label: Resmi fiyat listesi
        file: src/_data/resmiFiyatlar.json
        format: json
        fields:
          - label: Fiyatlar
            name: fiyatlar
            widget: list
            summary: "{{fields.marka}} {{fields.kod}} · {{fields.fiyat}}"
            hint: "Aramada otomatik bulunamayan resmi fiyatlar. Buraya girilen fiyat, aramada her kaynaktan önce gösterilir."
            fields:
              - { label: Marka, name: marka, widget: string }
              - { label: Model kodu, name: kod, widget: string, hint: "O ülkede kullanılan kod, örn. GMW-BZ5000GD-9JF veya CW2288-111" }
              - { label: O ülkedeki adı, name: ad, widget: string, required: false, hint: "Mağazada gösterilecek ad (Japonca olabilir)" }
              - { label: Ülke, name: ulke, widget: select, options: [{ label: Japonya, value: japonya }], default: japonya }
              - { label: Resmi fiyat (yerel para, vergiler dahil), name: fiyat, widget: number, value_type: int }
              - { label: Kaynak linki, name: kaynak, widget: string, hint: "Markanın resmi sayfası" }
              - { label: Kontrol tarihi, name: tarih, widget: datetime, format: "YYYY-MM-DD", date_format: "DD.MM.YYYY", time_format: false }
