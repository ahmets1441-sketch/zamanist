    create: true
    slug: "{{slug}}"
    fields:
      - { label: İsim, name: title, widget: string }
      - { label: Kapak fotoğrafı, name: kapak, widget: image, required: false }
      - { label: Kısa özet, name: ozet, widget: text, required: false, hint: "Listede ve Google'da başlığın altında görünür. 1-2 cümle." }
      - { label: Metin, name: body, widget: markdown }
  - name: araba-ve-saat
